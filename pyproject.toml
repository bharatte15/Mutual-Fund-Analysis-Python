[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfplan"
version = "1.0.0"
description = "Build, simulate and optimise a mutual fund investment plan in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "matplotlib>=3.8", "plotly>=5.20"]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
live = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mfplan = "mfplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
